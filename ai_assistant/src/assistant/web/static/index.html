<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Assistant</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <button class="btn btn-primary" id="new-chat" type="button">+ New chat</button>
      <nav class="session-list" id="session-list"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn btn-icon" id="toggle-sidebar" type="button" aria-label="Toggle sidebar">☰</button>
        <h1 class="title">AI Assistant</h1>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty" id="empty">
          <h2>How can I help you today?</h2>
        </div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message the assistant…" aria-label="Message" maxlength="4000"></textarea>
        <button class="btn btn-primary" id="send" type="submit" aria-label="Send">Send</button>
      </form>
    </main>
  </div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
